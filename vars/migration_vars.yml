---
# Control & Operator Namespaces
mtv_namespace: "openshift-mtv"
target_namespace: "target-namespace"

# Source Infrastructure (vSphere Provider)
vsphere_url: "https://<VCENTER_FQDN_OR_IP>/sdk"
vsphere_user: "<VCENTER_USERNAME>"
vsphere_password: "<VCENTER_PASSWORD>"
vsphere_insecure_skip_verify: true

# Custom Resource Naming
vsphere_secret_name: "vsphere-credentials"
source_provider_name: "vsphere-provider"
destination_provider_name: "host"
network_map_name: "network-map"
storage_map_name: "storage-map"
migration_plan_name: "vm-migration-plan"

# Network Mappings Array
network_mappings:
  - source_network: "<VSPHERE_PORT_GROUP_NAME>"
    destination_type: "pod" # Options: "pod" or "multus"
    # destination_name: "<NAMESPACE>/<NETWORK_ATTACHMENT_DEFINITION>" # Required if destination_type is "multus"

# Storage Mappings Array
storage_mappings:
  - source_datastore: "<VSPHERE_DATASTORE_NAME>"
    destination_storage_class: "<OPENSHIFT_STORAGE_CLASS_NAME>"

# List of VMs to Migrate in this Batch
vms_to_migrate:
  - name: "<SOURCE_VM_NAME_1>"
  - name: "<SOURCE_VM_NAME_2>"