---
- name: Execute vSphere to OpenShift VM Migration Framework
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - vars/migration_config.yml

  tasks:
    - name: Ensure Target Namespace Exists
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ target_namespace }}"

    - name: Create Provider Credentials Secret
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ vsphere_secret_name }}"
            namespace: "{{ mtv_namespace }}"
          type: Opaque
          stringData:
            user: "{{ vsphere_user }}"
            password: "{{ vsphere_password }}"
            insecureSkipVerify: "{{ vsphere_insecure_skip_verify | string }}"
            url: "{{ vsphere_url }}"

    - name: Create Source Provider
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: forklift.konveyor.io/v1beta1
          kind: Provider
          metadata:
            name: "{{ source_provider_name }}"
            namespace: "{{ mtv_namespace }}"
          spec:
            type: vsphere
            url: "{{ vsphere_url }}"
            secret:
              name: "{{ vsphere_secret_name }}"
              namespace: "{{ mtv_namespace }}"

    - name: Create Destination Provider
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: forklift.konveyor.io/v1beta1
          kind: Provider
          metadata:
            name: "{{ destination_provider_name }}"
            namespace: "{{ mtv_namespace }}"
          spec:
            type: openshift

    - name: Create Network Mapping
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: forklift.konveyor.io/v1beta1
          kind: NetworkMap
          metadata:
            name: "{{ network_map_name }}"
            namespace: "{{ mtv_namespace }}"
          spec:
            provider:
              source:
                name: "{{ source_provider_name }}"
                namespace: "{{ mtv_namespace }}"
              destination:
                name: "{{ destination_provider_name }}"
                namespace: "{{ mtv_namespace }}"
            map: >-
              {% set net_list = [] %}
              {% for net in network_mappings %}
                {% set dest = {'type': net.destination_type} %}
                {% if net.destination_name is defined %}
                  {% set _ = dest.update({'name': net.destination_name}) %}
                {% endif %}
                {% set _ = net_list.append({'source': {'name': net.source_network}, 'destination': dest}) %}
              {% endfor %}
              {{ net_list }}

    - name: Create Storage Mapping
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: forklift.konveyor.io/v1beta1
          kind: StorageMap
          metadata:
            name: "{{ storage_map_name }}"
            namespace: "{{ mtv_namespace }}"
          spec:
            provider:
              source:
                name: "{{ source_provider_name }}"
                namespace: "{{ mtv_namespace }}"
              destination:
                name: "{{ destination_provider_name }}"
                namespace: "{{ mtv_namespace }}"
            map: >-
              {% set store_list = [] %}
              {% for store in storage_mappings %}
                {% set _ = store_list.append({'source': {'name': store.source_datastore}, 'destination': {'storageClass': store.destination_storage_class}}) %}
              {% endfor %}
              {{ store_list }}

    - name: Create Migration Plan
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: forklift.konveyor.io/v1beta1
          kind: Plan
          metadata:
            name: "{{ migration_plan_name }}"
            namespace: "{{ mtv_namespace }}"
          spec:
            provider:
              source:
                name: "{{ source_provider_name }}"
                namespace: "{{ mtv_namespace }}"
              destination:
                name: "{{ destination_provider_name }}"
                namespace: "{{ mtv_namespace }}"
            map:
              network:
                name: "{{ network_map_name }}"
                namespace: "{{ mtv_namespace }}"
              storage:
                name: "{{ storage_map_name }}"
                namespace: "{{ mtv_namespace }}"
            targetNamespace: "{{ target_namespace }}"
            vms: "{{ vms_to_migrate }}"

    - name: Trigger Migration Execution
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: forklift.konveyor.io/v1beta1
          kind: Migration
          metadata:
            name: "exec-{{ migration_plan_name }}"
            namespace: "{{ mtv_namespace }}"
          spec:
            plan:
              name: "{{ migration_plan_name }}"
              namespace: "{{ mtv_namespace }}"

    - name: Monitor Migration Progress Until Complete
      kubernetes.core.k8s_info:
        api_version: forklift.konveyor.io/v1beta1
        kind: Migration
        name: "exec-{{ migration_plan_name }}"
        namespace: "{{ mtv_namespace }}"
      register: migration_status
      until: >
        migration_status.resources | default([]) | length > 0 and
        (migration_status.resources[0].status.conditions | default([])
         | selectattr('type', 'equalto', 'Succeeded')
         | selectattr('status', 'equalto', 'True')
         | list | length > 0)
      retries: 120
      delay: 30